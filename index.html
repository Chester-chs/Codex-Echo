<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script data-canonical-redirect>
      (() => {
        const legacyOrigin = document.documentElement.getAttribute("data-legacy-origin");
        if (!legacyOrigin || window.location.origin !== legacyOrigin) return;
        const destination = new URL("https://echo-radar.pages.dev/");
        destination.pathname = window.location.pathname;
        destination.search = window.location.search;
        destination.hash = window.location.hash;
        window.location.replace(destination.href);
      })();
    </script>
    <link rel="canonical" href="https://echo-radar.pages.dev/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4f6f3" />
    <title>Codex Echo · Reset Radar &amp; Bark Alerts</title>
    <meta name="description" content="Codex Echo: reset announcements, history, Tibo posts, source forecasts and iPhone Bark alerts. Codex 回响：查看 Codex 重置公告、历史日历、Tibo 推文与来源预测，接收 Bark 提醒。" />
    <link rel="icon" type="image/svg+xml" href="/static/pulse.svg" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
